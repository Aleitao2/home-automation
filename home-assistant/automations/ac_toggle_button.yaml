id: '1788638560740'
alias: A/C Toggle Button Logic
triggers:
- trigger: state
  entity_id: input_button.toggle_a_c
actions:
- if:
  - condition: state
    entity_id: climate.air_conditioner_613a94_air_conditioner
    state: cool
  then:
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.air_conditioner_613a94_air_conditioner
    data:
      hvac_mode: 'off'
  else:
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.air_conditioner_613a94_air_conditioner
    data:
      hvac_mode: cool
mode: single
